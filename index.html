<script>
// --- Helpers ---
const THEMES = {
  light: { bg:'#FFFBF5', paper:'#FFFCF8', text:'#1A1A1A', border:'rgba(0,0,0,0.10)', muted:'rgba(0,0,0,0.45)' },
  sepia: { bg:'#F4ECD8', paper:'#FBF6E9', text:'#433422', border:'rgba(67,52,34,0.12)', muted:'rgba(67,52,34,0.55)' },
  dark: { bg:'#1E1E1E', paper:'#252525', text:'#E8E6E1', border:'rgba(255,255,255,0.12)', muted:'rgba(255,255,255,0.5)' },
  night: { bg:'#0F0F0F', paper:'#151515', text:'#C8C6C1', border:'rgba(255,255,255,0.10)', muted:'rgba(255,255,255,0.45)' },
};
const FONTS = {
  pretendard: { label:'Pretendard Sans', family:'Pretendard, -apple-system, sans-serif' },
  'noto-serif': { label:'본명조', family:'"Noto Serif KR", serif' },
  maru: { label:'마루부리', family:'"Gowun Batang", "Noto Serif KR", serif' },
  nanum: { label:'나눔명조', family:'"Nanum Myeongjo", serif' },
  gowun: { label:'고운돋움', family:'"Gowun Dodum", sans-serif' },
};

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function textToHtml(text){
  const paras = text.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);
  if(!paras.length) return `<p>${escapeHtml(text).replace(/\n/g,'<br/>')}</p>`;
  return paras.map(p=>{
    if(p.startsWith('>')||p.startsWith('“')||p.startsWith('‘')) return `<blockquote>${escapeHtml(p).replace(/\n/g,'<br/>')}</blockquote>`;
    return `<p>${escapeHtml(p).replace(/\n/g,'<br/>')}</p>`;
  }).join('\n');
}

function decodeTextBuffer(buf){
  // BOM 제거 + utf-8 fatal 시도 + euc-kr(cp949) + fallback
  const tryDec = (enc, fatal=false) => {
    try { const d = new TextDecoder(enc, {fatal}); let t = d.decode(buf); if(t.charCodeAt(0)===0xFEFF) t=t.slice(1); return t; } catch { return null; }
  };
  let t = tryDec('utf-8', true);
  if(t!==null && !t.includes('\uFFFD')) return {text:t, enc:'utf-8'};
  t = tryDec('euc-kr'); if(t && !t.includes('\uFFFD')) return {text:t, enc:'euc-kr'};
  t = tryDec('utf-8'); if(t) return {text:t, enc:'utf-8-fallback'};
  t = tryDec('windows-1252'); if(t) return {text:t, enc:'ansi'};
  return {text: new TextDecoder().decode(buf), enc:'unknown'};
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

function parseTOC(rawText, contentHtml){
  const toc=[];
  try {
    const doc = new DOMParser().parseFromString(contentHtml, 'text/html');
    const heads = doc.querySelectorAll('h1,h2,h3');
    if(heads.length>=2){
      heads.forEach((h,i)=>{
        const title = h.textContent?.trim() || `제목 ${i+1}`;
        // charOffset 찾기
        const idx = rawText.indexOf(title.slice(0,20));
        toc.push({id:`h-${i}`, title, offset:i, charOffset: idx>=0? idx : Math.floor((i/heads.length)*rawText.length)});
      });
      if(toc.length) return toc;
    }
  } catch {}
  // 한글 로직
  const krPattern = /^(?:제\s*\d+\s*[장화편부회]|제\s*[일이삼사오육칠팔구십백천]+\s*[장화]|프롤로그|프롤|에필로그|에필|서문|서장|후기|작가\s*후기|작가의\s*말|외전|번외|인터미션|Chapter\s*\d+|CHAPTER\s*\d+|Ch\.\s*\d+|\d+\s*장|\d+\s*화)/im;
  const lines = rawText.split('\n');
  lines.forEach((line, i)=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    if(krPattern.test(trimmed) && trimmed.length<80){
      toc.push({id:`kr-${i}`, title:trimmed, offset:i, charOffset: rawText.split('\n').slice(0,i).join('\n').length});
    }
  });
  if(toc.length>=2) return toc;
  // 임의 목차 8~15
  const auto = [];
  const count = rawText.length>20000 ? 15 : rawText.length>8000 ? 12 : 8;
  for(let i=0;i<count;i++){
    const approx = Math.floor((rawText.length/count)*i);
    const slice = rawText.slice(approx, approx+200);
    const m = slice.match(/[^.!?。\n]{8,80}[.!?。]/);
    let title = m ? m[0].trim() : slice.slice(0,40).trim();
    title = title.replace(/\s+/g,' ');
    if(title.length>40) title = title.slice(0,40)+'…';
    auto.push({id:`auto-${i}`, title: `${i+1}부 — ${title||'이어지는 이야기'}`, offset:i, charOffset: approx});
  }
  return auto;
}

// --- State ---
let books = [];
let currentId = null;
let theme = 'light';
let fontFamily = 'noto-serif';
let fontSize = 18;
let letterSpacing = 0.02;
let lineHeight = 1.85;
let view = 'home'; // home | reader
let showLibrary = false;
let showPaste = false;
let showToc = false;
let tocTab = 'toc';
let showType = false;
let showTts = false;
let progress = 0;
let ttsPlaying = false;
let ttsRate = 1;
let ttsIndex = null;
let ttsSentences = [];
let islandHidden = false;
let hasLoaded = false;
let dragOver = false;

const themeColors = ()=> THEMES[theme];

function save(){
  if(!hasLoaded) return;
  try { localStorage.setItem('seorak-library', JSON.stringify(books)); } catch {}
  try { localStorage.setItem('seorak-theme', theme); localStorage.setItem('seorak-font', fontFamily); localStorage.setItem('seorak-fs', fontSize); localStorage.setItem('seorak-lh', lineHeight); localStorage.setItem('seorak-ls', letterSpacing); } catch {}
}
function load(){
  try {
    const raw = localStorage.getItem('seorak-library');
    if(raw){ const p=JSON.parse(raw); if(Array.isArray(p)) books=p; }
    const t=localStorage.getItem('seorak-theme'); if(t && THEMES[t]) theme=t;
    const ff=localStorage.getItem('seorak-font'); if(ff && FONTS[ff]) fontFamily=ff;
    const fs=localStorage.getItem('seorak-fs'); if(fs) fontSize=parseInt(fs,10);
    const lh=localStorage.getItem('seorak-lh'); if(lh) lineHeight=parseFloat(lh);
    const ls=localStorage.getItem('seorak-ls'); if(ls) letterSpacing=parseFloat(ls);
  } catch {}
  hasLoaded=true;
}

// --- File Parsers ---
async function parseMdSimple(raw){
  let html = escapeHtml(raw);
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>').replace(/^##\s+(.+)$/gm, '<h2>$1</h2>').replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  return html.split(/\n{2,}/).map(b=> b.startsWith('<h') ? b : `<p>${b.replace(/\n/g,'<br/>')}</p>`).join('\n');
}
function parseHTMLFile(raw){
  try{
    const doc = new DOMParser().parseFromString(raw,'text/html');
    doc.querySelectorAll('script,style,noscript,iframe').forEach(el=>el.remove());
    const codeCount = doc.querySelectorAll('code,pre').length;
    if(codeCount>20){ const text=doc.body.textContent||''; return {html:textToHtml(text), text}; }
    return {html:doc.body.innerHTML, text:doc.body.textContent||''};
  }catch{ return {html:textToHtml(raw), text:raw}; }
}

async function parseFileByType(file){
  const ext = file.name.split('.').pop()?.toLowerCase()||'txt';
  const title = file.name.replace(/\.[^.]+$/,'');
  if(ext==='txt' || ext==='md'){
    const buf = await file.arrayBuffer();
    const {text} = decodeTextBuffer(buf);
    if(ext==='md'){
      try{ await loadScript('https://cdn.jsdelivr.net/npm/marked/marked.min.js'); if(window.marked){ return {title, rawText:text, contentHtml: window.marked.parse(text)}; } }catch{}
      return {title, rawText:text, contentHtml: await parseMdSimple(text)};
    }
    return {title, rawText:text, contentHtml: textToHtml(text)};
  }
  if(ext==='html'||ext==='htm'){
    const txt = await file.text(); const {html,text:raw}=parseHTMLFile(txt); return {title, rawText:raw, contentHtml:html};
  }
  if(ext==='docx'){
    try{
      await loadScript('https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js');
      const buf=await file.arrayBuffer(); const result=await window.mammoth.convertToHtml({arrayBuffer:buf}); const html=result.value; const tmp=document.createElement('div'); tmp.innerHTML=html; return {title, rawText:tmp.textContent||'', contentHtml:html};
    }catch{ const buf=await file.arrayBuffer(); const {text}=decodeTextBuffer(buf); return {title, rawText:text, contentHtml:textToHtml(text)}; }
  }
  if(ext==='pdf'){
    const loadPdfJs = async()=>{
      const cdns=['https://unpkg.com/pdfjs-dist@4.4.168/build/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js'];
      for(const url of cdns){ try{ await loadScript(url); if(window.pdfjsLib) return window.pdfjsLib; }catch{} }
      throw new Error('pdf.js 로드 실패');
    };
    try{
      const pdfjsLib = await loadPdfJs();
      try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@4.4.168/build/pdf.worker.min.js'; }catch{}
      const buf=await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf, cMapUrl:'https://unpkg.com/pdfjs-dist@4.4.168/cmaps/', cMapPacked:true, standardFontDataUrl:'https://unpkg.com/pdfjs-dist@4.4.168/standard_fonts/', useSystemFonts:true, disableWorker:true, verbosity:0}).promise;
      let fullText=''; let htmlParts=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i); const content=await page.getTextContent();
        const linesMap=new Map(); const yTol=3;
        content.items.forEach(it=>{
          if(!it.str||!it.transform) return; const x=it.transform[4], y=it.transform[5]; const str=(it.str).normalize('NFKC'); if(!str.trim()&&str!==' ') return;
          let found=null; for(const k of linesMap.keys()){ if(Math.abs(k-y)<yTol){ found=k; break; } } const key=found??y;
          if(!linesMap.has(key)) linesMap.set(key,[]); linesMap.get(key).push({x,str,width:it.width||0});
        });
        const sortedY=Array.from(linesMap.keys()).sort((a,b)=>b-a);
        let pageText=''; let linesHtml=[];
        sortedY.forEach(y=>{
          const items=linesMap.get(y); items.sort((a,b)=>a.x-b.x);
          let line=''; let lastX=-1,lastW=0;
          items.forEach(item=>{ if(lastX>=0){ const gap=item.x-(lastX+lastW); if(gap>4) line+=' '; } line+=item.str; lastX=item.x; lastW=item.width||item.str.length*5; });
          line=line.replace(/\s{2,}/g,' ').trim();
          if(line){ pageText+=line+'\n'; linesHtml.push(escapeHtml(line)); }
        });
        const trimmed=pageText.trim(); fullText+=trimmed+'\n\n';
        if(trimmed) htmlParts.push(`<div class="pdf-page"><div style="font-size:10px; letter-spacing:0.12em; opacity:0.35; margin:24px 0 8px;">— ${i} / ${pdf.numPages} —</div><p>${linesHtml.join('<br/>')}</p></div>`);
      }
      const normalized=fullText.normalize('NFKC').trim();
      if(normalized.length<20){
        return {title, rawText:'', contentHtml:`<div style="padding:24px; border:1px dashed ${themeColors().border}; border-radius:16px; line-height:1.7; opacity:0.8;"><strong>스캔된 PDF로 보입니다.</strong><br/>텍스트가 내장되지 않아 추출할 수 없습니다. OCR 파일로 시도해보세요.<br/><br/>페이지 수: ${pdf.numPages}</div>`};
      }
      return {title, rawText:normalized, contentHtml:htmlParts.join('\n')};
    }catch(e){
      console.error(e);
      return {title, rawText:'', contentHtml:`<div style="padding:24px; border:1px solid #e88; border-radius:16px; line-height:1.8;"><strong style="color:#c33;">PDF를 읽지 못했습니다.</strong><br/>${escapeHtml(e.message||'오류')}<br/><br/>네트워크 확인 후 다시 시도해주세요. 스캔본은 텍스트 추출이 불가능합니다.</div>`};
    }
  }
  if(ext==='epub'){
    try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      let htmlCombined='', textCombined='';
      const list=Object.keys(zip.files).filter(k=>k.endsWith('.html')||k.endsWith('.xhtml')||k.endsWith('.htm')).sort();
      for(const p of list.slice(0,100)){ const f=zip.file(p); if(!f) continue; const content=await f.async('string'); const {html,text}=parseHTMLFile(content); htmlCombined+=html+'\n'; textCombined+=text+'\n\n'; }
      if(htmlCombined) return {title, rawText:textCombined, contentHtml:htmlCombined};
    }catch{}
  }
  const buf=await file.arrayBuffer(); const {text}=decodeTextBuffer(buf); return {title, rawText:text, contentHtml:textToHtml(text)};
}

// --- Icons ---
const Icons = {
  library:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 0 0 5H20"/><path d="M8 2v17"/></svg>`,
  folder:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
  clip:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>`,
  list:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>`,
  type:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>`,
  volume:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
  x:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  trash:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  bookmark:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
};

// --- Render ---
function render(){
  const c = THEMES[theme];
  document.body.style.background = c.bg;
  document.body.style.color = c.text;
  const app = document.getElementById('app');
  if(view==='home'){
    app.innerHTML = `
      <div class="min-h-screen relative flex flex-col" style="background:${c.bg}">
        <div class="pointer-events-none absolute inset-0" style="background: radial-gradient(1200px 800px at 50% -10%, ${c.paper} 0%, transparent 60%), radial-gradient(900px 600px at 85% 120%, ${c.border} 0%, transparent 50%)"></div>
        <div class="flex-1 flex flex-col items-center justify-center px-6 relative z-10">
          <div class="text-center">
            <h1 class="text-[42px] md:text-[56px] font-serif font-bold tracking-[-0.03em] leading-none mb-4" style="font-family:${FONTS['noto-serif'].family}">Seorak</h1>
            <p class="text-[13px] tracking-[0.18em] uppercase opacity-60 mb-2">서락</p>
            <p class="text-[15px] opacity-60 font-serif">읽는다는 것은 머무는 것</p>
            <div class="mt-10 h-px w-12 mx-auto" style="background:${c.border}"></div>
            <p class="mt-6 text-[12px] opacity-40">파일을 끌어다 놓거나 아래 아이콘으로 시작하세요<br/>txt · md · html · docx · pdf · epub</p>
          </div>
        </div>
        <!-- Home Island 3 icons -->
        <div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-20">
          <div class="glass flex items-center gap-1 p-2 rounded-full paper-shadow" style="background:${c.paper}CC; border:1px solid ${c.border}">
            <button onclick="toggleLibrary()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 transition" title="서재">${Icons.library}</button>
            <button onclick="document.getElementById('fileInput').click()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="파일열기">${Icons.folder}</button>
            <button onclick="openPaste()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="붙여넣기">${Icons.clip}</button>
          </div>
        </div>
        ${dragOver ? `<div class="fixed inset-0 z-30 flex items-center justify-center" style="background:${c.bg}E6; backdrop-filter:blur(12px);"><div class="text-center"><div class="text-2xl mb-2">놓아서 열기</div><div class="text-sm opacity-60">txt, pdf, epub 등 지원</div></div></div>` : ''}
      </div>
      ${renderLibrarySheet()}
      ${renderPasteModal()}
      <input id="fileInput" type="file" class="hidden" accept=".txt,.md,.html,.htm,.docx,.pdf,.epub" multiple />
    `;
    const fi = document.getElementById('fileInput');
    if(fi) fi.onchange = e=> { if(e.target.files) handleFiles(e.target.files); };
    // drag
    app.ondragover = e=>{ e.preventDefault(); if(!dragOver){ dragOver=true; render(); } };
    app.ondragleave = ()=>{ dragOver=false; render(); };
    app.ondrop = e=>{ e.preventDefault(); dragOver=false; if(e.dataTransfer.files) handleFiles(e.dataTransfer.files); render(); };
  } else {
    const book = books.find(b=>b.id===currentId);
    if(!book){ view='home'; render(); return; }
    const font = FONTS[fontFamily];
    app.innerHTML = `
      <div class="min-h-screen flex flex-col" style="background:${c.paper}; color:${c.text}">
        <div class="h-1 w-full sticky top-0 z-10" style="background:${c.border}"><div class="h-full" style="width:${progress}%; background:${c.text}; transition:width 0.2s;"></div></div>
        <div id="reader" class="flex-1 overflow-y-auto px-6 md:px-12 lg:px-24 py-12 max-w-[760px] mx-auto w-full" style="font-family:${font.family}; font-size:${fontSize}px; letter-spacing:${letterSpacing}em; line-height:${lineHeight};">
          <div class="mb-12">
            <div class="text-[11px] tracking-[0.14em] uppercase opacity-50 mb-3">${book.wordCount.toLocaleString()}자 · ${Math.ceil(book.progress||0)}% 읽음</div>
            <h1 class="text-[28px] font-bold leading-tight tracking-tight text-balance">${escapeHtml(book.title)}</h1>
          </div>
          <div id="content" class="reading-content">${book.contentHtml}</div>
          <div class="h-32"></div>
        </div>
        <!-- Reader Island 4 icons -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20 island ${islandHidden?'hidden':''}" id="island">
          <div class="glass flex items-center gap-1 p-2 rounded-full paper-shadow" style="background:${c.paper}F2; border:1px solid ${c.border}">
            <button onclick="toggleToc()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="목차">${Icons.list}</button>
            <button onclick="toggleType()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="서체">${Icons.type}</button>
            <button onclick="toggleTts()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="음성">${Icons.volume}</button>
            <div class="w-px h-5 mx-1" style="background:${c.border}"></div>
            <button onclick="closeReader()" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-black/5 transition" title="닫기">${Icons.x}</button>
          </div>
        </div>
      </div>
      ${renderTocSheet()}
      ${renderTypeSheet()}
      ${renderTtsSheet()}
    `;
    const reader = document.getElementById('reader');
    if(reader){
      reader.onscroll = ()=>{
        const st=reader.scrollTop; const sh=reader.scrollHeight-reader.clientHeight; const prog=sh>0?(st/sh)*100:0; progress=prog;
        document.querySelector('.h-1 div').style.width=prog+'%';
        if(currentId){ const idx=books.findIndex(b=>b.id===currentId); if(idx>=0){ books[idx].scrollTop=st; books[idx].progress=prog; books[idx].lastRead=Date.now(); save(); } }
        if(st> (window._lastSt||0)+12){ islandHidden=true; document.getElementById('island')?.classList.add('hidden'); }
        else if(st< (window._lastSt||0)-12){ islandHidden=false; document.getElementById('island')?.classList.remove('hidden'); }
        window._lastSt=st;
      };
      setTimeout(()=>{ if(book.scrollTop) reader.scrollTop=book.scrollTop; },80);
      // auto hide
      let timer=null;
      window.onmousemove=()=>{ islandHidden=false; document.getElementById('island')?.classList.remove('hidden'); clearTimeout(timer); timer=setTimeout(()=>{ if(reader.scrollTop>120){ islandHidden=true; document.getElementById('island')?.classList.add('hidden'); } },3000); };
    }
  }
}

      </div>

}

  const c=themeColors();
  return `
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6">
      <div class="absolute inset-0" style="background:rgba(0,0,0,0.3); backdrop-filter:blur(12px);" onclick="closePaste()"></div>
      <div class="relative w-full md:max-w-[640px] glass rounded-t-[24px] md:rounded-[24px] paper-shadow overflow-hidden" style="background:${c.paper}">

          <textarea id="pasteText" placeholder="여기에 텍스트를 붙여넣으세요..." class="w-full h-[280px] px-4 py-3 rounded-xl text-sm resize-none" style="background:${c.bg}; border:1px solid ${c.border}"></textarea>
          <div class="flex gap-2 mt-4"><button onclick="closePaste()" class="flex-1 py-3 rounded-xl text-sm" style="background:${c.bg}; border:1px solid ${c.border}">취소</button><button onclick="savePaste()" class="flex-1 py-3 rounded-xl text-sm font-medium text-white" style="background:${c.text}">열기</button></div>
        </div>

function renderTocSheet(){
  if(!showToc) return '';
  const c=themeColors(); const book=books.find(b=>b.id===currentId); if(!book) return '';
  const tocHtml = book.toc.map(t=>`<button onclick="jumpTo(${t.charOffset})" class="w-full text-left px-4 py-3 rounded-xl hover:bg-black/5 text-[14px] leading-snug"><span class="opacity-50 mr-2">${t.id.startsWith('auto')?'·':''}</span>${escapeHtml(t.title)}</button>`).join('');
  const bmHtml = book.bookmarks.length ? book.bookmarks.map(b=>`<button onclick="jumpTo(${b.charOffset})" class="w-full text-left px-4 py-3 rounded-xl hover:bg-black/5"><div class="text-[13px]">${escapeHtml(b.title)}</div><div class="text-[11px] opacity-50">${new Date(b.createdAt).toLocaleString()} · ${Math.round(b.progress)}%</div></button>`).join('') : `<div class="py-12 text-center text-sm opacity-50">책갈피가 없어요<br/>음성 패널에서 추가할 수 있어요</div>`;
  return `
    <div class="fixed inset-0 z-40 flex">
      <div class="absolute inset-0" style="background:rgba(0,0,0,0.2); backdrop-filter:blur(6px);" onclick="toggleToc()"></div>
      <div class="relative w-[84%] max-w-[360px] glass h-full overflow-hidden flex flex-col paper-shadow" style="background:${c.paper}; border-right:1px solid ${c.border}">
        <div class="p-6 pb-3 flex items-center justify-between"><div class="font-semibold">목차</div><button onclick="toggleToc()" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center">${Icons.x}</button></div>
        <div class="px-2 flex gap-1"><button onclick="switchTocTab('toc')" class="flex-1 py-2 rounded-full text-[13px] ${tocTab==='toc'?'bg-black text-white':'bg-black/5'}">목차</button><button onclick="switchTocTab('bookmarks')" class="flex-1 py-2 rounded-full text-[13px] ${tocTab==='bookmarks'?'bg-black text-white':'bg-black/5'}">책갈피</button></div>
        <div class="flex-1 overflow-y-auto p-2">${tocTab==='toc'?tocHtml:bmHtml}</div>
      </div>
    </div>`;
}

function renderTypeSheet(){
  if(!showType) return '';
  const c=themeColors();
  return `
    <div class="fixed inset-0 z-40 flex flex-col justify-end">
      <div class="absolute inset-0" style="background:rgba(0,0,0,0.2); backdrop-filter:blur(6px);" onclick="toggleType()"></div>
      <div class="relative glass rounded-t-[28px] paper-shadow p-6" style="background:${c.paper}">
        <div class="flex items-center justify-between mb-6"><div class="font-semibold">서체와 모양</div><button onclick="toggleType()" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center">${Icons.x}</button></div>
        <div class="space-y-6">
          <div><div class="text-[11px] tracking-widest uppercase opacity-60 mb-3">글꼴</div><div class="flex flex-wrap gap-2">${Object.entries(FONTS).map(([k,v])=>`<button onclick="setFont('${k}')" class="px-4 py-2 rounded-full text-[13px] border ${fontFamily===k?'bg-black text-white border-black':'bg-transparent'}" style="font-family:${v.family}; border-color:${c.border}">${v.label}</button>`).join('')}</div></div>
          <div class="grid grid-cols-3 gap-4">
            <div><div class="text-[11px] opacity-60 mb-2">크기 ${fontSize}</div><input type="range" min="14" max="28" value="${fontSize}" oninput="setSize(this.value)" class="w-full"></div>
            <div><div class="text-[11px] opacity-60 mb-2">자간 ${letterSpacing}</div><input type="range" min="0" max="0.12" step="0.01" value="${letterSpacing}" oninput="setLS(this.value)" class="w-full"></div>
            <div><div class="text-[11px] opacity-60 mb-2">행간 ${lineHeight}</div><input type="range" min="1.4" max="2.4" step="0.1" value="${lineHeight}" oninput="setLH(this.value)" class="w-full"></div>
          </div>
          <div><div class="text-[11px] tracking-widest uppercase opacity-60 mb-3">테마</div><div class="flex gap-2">${Object.keys(THEMES).map(k=>`<button onclick="setThemeMode('${k}')" class="flex-1 py-3 rounded-xl border text-[13px] ${theme===k?'bg-black text-white':''}" style="border-color:${THEMES[k].border}; background:${theme===k?THEMES[k].text:THEMES[k].paper}; color:${theme===k?'white':THEMES[k].text}">${k}</button>`).join('')}</div></div>
        </div>
      </div>
    </div>`;
}

function renderTtsSheet(){
  if(!showTts) return '';
  const c=themeColors();
  return `
    <div class="fixed inset-0 z-40 flex flex-col justify-end">
      <div class="absolute inset-0" style="background:rgba(0,0,0,0.2); backdrop-filter:blur(6px);" onclick="toggleTts()"></div>
      <div class="relative glass rounded-t-[28px] paper-shadow p-6" style="background:${c.paper}">
        <div class="flex items-center justify-between mb-5"><div class="font-semibold">음성 읽기</div><button onclick="toggleTts()" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center">${Icons.x}</button></div>
        <div class="flex items-center gap-3 mb-5">
          <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center">${ttsPlaying?'❚❚':'▶'}</button>
          <div class="flex-1"><div class="text-[13px]">${ttsPlaying? (ttsIndex!==null? (ttsSentences[ttsIndex]?.slice(0,40)||'') : '재생 중...') : '준비됨'}</div><div class="text-[11px] opacity-60">시스템 TTS · 한국어 우선</div></div>
          <button onclick="addBookmark()" class="px-4 py-2 rounded-full bg-black/5 text-[12px] flex items-center gap-1">${Icons.bookmark} 책갈피</button>
        </div>
        <div><div class="text-[11px] opacity-60 mb-2">속도 ${ttsRate}</div><input type="range" min="0.7" max="1.5" step="0.1" value="${ttsRate}" oninput="setRate(this.value)" class="w-full"></div>
      </div>
    </div>`;
}

// --- Actions ---
function toggleLibrary(){ showLibrary=!showLibrary; render(); }
function openPaste(){ showPaste=true; render(); setTimeout(()=>{ document.getElementById('pasteText')?.focus(); },100); }
function closePaste(){ showPaste=false; render(); }
function savePaste(){
  const titleEl=document.getElementById('pasteTitle'); const textEl=document.getElementById('pasteText');
  const t=(titleEl?.value||'').trim(); const txt=(textEl?.value||'').trim(); if(!txt) return;
  const raw=txt; const content=textToHtml(raw); const toc=parseTOC(raw, content);
  const book={id:Date.now().toString(36)+Math.random().toString(36).slice(2), title: t|| raw.slice(0,30).replace(/\n/g,' ').trim()||'붙여넣은 글', contentHtml:content, rawText:raw, toc, progress:0, scrollTop:0, bookmarks:[], createdAt:Date.now(), lastRead:Date.now(), wordCount:raw.length};
  books.unshift(book); currentId=book.id; view='reader'; showPaste=false; showLibrary=false; save(); render();
}
async function handleFiles(files){
  for(const file of files){
    const allowed=['txt','md','html','htm','docx','pdf','epub']; const ext=file.name.split('.').pop()?.toLowerCase()||''; if(!allowed.includes(ext)) continue;
    try{
      const {title, rawText, contentHtml} = await parseFileByType(file);
      const toc=parseTOC(rawText, contentHtml);
      const book={id:Date.now().toString(36)+Math.random().toString(36).slice(2), title: title||'제목 없는 책', contentHtml, rawText, toc, progress:0, scrollTop:0, bookmarks:[], createdAt:Date.now(), lastRead:Date.now(), wordCount: rawText.length};
      books.unshift(book); currentId=book.id; view='reader'; showLibrary=false; save(); render();
    }catch(err){ console.warn(err); alert(`파일을 읽지 못했어요: ${file.name}`); }
  }
}
function openBook(id){ currentId=id; view='reader'; showLibrary=false; const b=books.find(x=>x.id===id); if(b) b.lastRead=Date.now(); save(); render(); }
function deleteBook(id){ books=books.filter(b=>b.id!==id); if(currentId===id){ view='home'; currentId=null; } save(); render(); }
function closeReader(){ view='home'; save(); render(); }
function toggleToc(){ showToc=!showToc; render(); }
function switchTocTab(t){ tocTab=t; render(); }
function toggleType(){ showType=!showType; render(); }
function toggleTts(){ showTts=!showTts; render(); }
function setFont(k){ fontFamily=k; save(); render(); }
function setSize(v){ fontSize=parseInt(v,10); save(); render(); }
function setLS(v){ letterSpacing=parseFloat(v); save(); render(); }
function setLH(v){ lineHeight=parseFloat(v); save(); render(); }
function setThemeMode(k){ theme=k; save(); render(); }
function jumpTo(offset){
  const reader=document.getElementById('reader'); const content=document.getElementById('content'); if(!reader||!content) return;
  // charOffset 기반 근사 스크롤 - 실제로는 텍스트 길이 비례로
  const book=books.find(b=>b.id===currentId); if(!book) return;
  const ratio = offset / (book.rawText.length||1); const target = reader.scrollHeight * ratio;
  reader.scrollTo({top: target, behavior:'smooth'}); showToc=false; render();
}
function addBookmark(){
  const book=books.find(b=>b.id===currentId); if(!book) return;
  const reader=document.getElementById('reader'); const prog = reader ? (reader.scrollTop/(reader.scrollHeight-reader.clientHeight))*100 : 0;
  const offset = Math.floor((prog/100)*book.rawText.length);
  const snippet = book.rawText.slice(offset, offset+40).replace(/\n/g,' ').trim();
  book.bookmarks.unshift({id:Date.now().toString(36), title: snippet||`책갈피 ${book.bookmarks.length+1}`, charOffset: offset, progress: prog, createdAt: Date.now()});
  save(); alert('책갈피가 추가되었습니다'); render();
}
// TTS
function prepareSentences(){ const book=books.find(b=>b.id===currentId); if(!book) return []; const text=book.rawText; const sents=text.match(/[^.!?。\n]+[.!?。\n]+|[^.!?。\n]+$/g)||[text]; return sents.map(s=>s.trim()).filter(s=>s.length>2).slice(0,2000); }
function speak(idx){
  if(idx>=ttsSentences.length){ ttsPlaying=false; ttsIndex=null; render(); return; }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(ttsSentences[idx]);
  const voices=window.speechSynthesis.getVoices(); const ko=voices.find(v=>v.lang.includes('ko'))||voices[0]; if(ko) u.voice=ko; u.rate=ttsRate; u.lang='ko-KR';
  u.onend=()=>{ ttsIndex=idx+1; speak(idx+1); };
  u.onerror=()=>{ ttsPlaying=false; render(); };
  window.speechSynthesis.speak(u); ttsPlaying=true; ttsIndex=idx; render();
  // highlight
  const content=document.getElementById('content'); if(content){ /* highlight logic could be added */ }
}
function togglePlay(){
  if(ttsPlaying){ window.speechSynthesis.cancel(); ttsPlaying=false; render(); return; }
  ttsSentences=prepareSentences(); if(!ttsSentences.length) return; speak(ttsIndex||0);
}
function setRate(v){ ttsRate=parseFloat(v); render(); }

// Init
load();
render();

// PWA manifest + SW
(function(){
  try{
    const makeIcon = (size)=>{
      const c=document.createElement('canvas'); c.width=size; c.height=size; const ctx=c.getContext('2d');
      ctx.fillStyle='#FFFBF5'; ctx.fillRect(0,0,size,size); ctx.fillStyle='#1A1A1A'; ctx.font=`bold ${Math.round(size*0.51)}px "Noto Serif KR", serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('서', size/2, size*0.55);
      return c.toDataURL('image/png');
    };
    const icon512=makeIcon(512), icon192=makeIcon(192);
    const manifest={name:'Seorak 서락', short_name:'서락', description:'고요한 독서를 위한 서재', start_url:'.', display:'standalone', background_color:'#FFFBF5', theme_color:'#FFFBF5', icons:[{src:icon512, sizes:'512x512', type:'image/png', purpose:'any maskable'},{src:icon192, sizes:'192x192', type:'image/png', purpose:'any maskable'}]};
    const url='data:application/json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
    let link=document.getElementById('manifest-link'); link.rel='manifest'; link.href=url;
    const swCode=`const CACHE='seorak-v5';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']).then(()=>self.skipWaiting())))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{const req=e.request; if(req.method!=='GET') return; e.respondWith(caches.match(req).then(cached=>{ if(cached) return cached; return fetch(req).then(res=>{ const clone=res.clone(); caches.open(CACHE).then(cache=>cache.put(req,clone)).catch(()=>{}); return res; }).catch(()=>caches.match('./')); }));});`;
    const blob=new Blob([swCode],{type:'text/javascript'}); const swUrl=URL.createObjectURL(blob);
    if('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl,{scope:'./'}).catch(()=>{});
  }catch(e){ console.warn(e); }
})();
</script>
